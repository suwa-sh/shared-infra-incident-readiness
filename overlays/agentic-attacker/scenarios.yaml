# 公式 overlay: agentic-attacker readiness — Tabletop 演習シナリオ 1 本。
#
# 出典と 4 次元の背景は responsibility.yaml のヘッダを参照。
# 「自律エージェント型攻撃者 / 週末横移動 / 商用APIが解析を拒否する分岐」を
# 含む、防御側の判断訓練シナリオ。攻撃手順は扱わず、判断の分岐だけを注入する。
extends: shared-infra-tabletop-scenarios
compatible_base_version: 1
add:
  - id: "scenarios.agentic-attacker"
    title: 自律AIエージェント型攻撃者 → 週末横移動・商用APIの解析拒否
    shared_component: データ処理パイプラインを含む共有基盤 (処理ワーカー + 複数内部クラスタ)
    affected_brands: 3   # 1テナント起点の侵害が複数テナントへ波及し得る構図を想定
    trigger: >-
      金曜夜、1テナントの処理ワーカーで異常なコード実行を検知。短命サンドボックス群からの
      機械速度アクションと判明し、週末をまたぐ横移動の兆候が出る
    duration_minutes: 90
    injects:
      - at_minute: 0
        event: >-
          金曜夜に EDR が短命サンドボックス群からの異常アクションを大量検知 (数千件規模)。
          攻撃主体が人間かエージェントかは未確定
      - at_minute: 15
        event: >-
          イベントが1万件を超え、人手の一次トリアージが物理的に追いつかないと判明。
          AIトリアージ (RB20/AC16) を起動するか、誰が判断するかを問う
      - at_minute: 30
        event: >-
          商用 AI API が攻撃アーティファクト入りの解析要求を安全ガードレールでブロック。
          主権フォレンジック基盤 (RB21/AC17) への切替を判断する必要が生じる
      - at_minute: 60
        event: >-
          窃取された認証情報による別クラスタへの横移動の痕跡。週末オンコール体制のまま
          封じ込め (RB23) と認証情報の一括失効 (RB06/AC18) を判断する
    facilitation_questions:
      - RB20 の AIトリアージは誰が起動するか。人手前提の初動 RACI は機械速度の攻撃で破綻しないか
      - >-
        RB21/RB22 の主権フォレンジック解析基盤は平時に検証済みか
        (検証日・切替所要時間・必要計算資源の証跡を確認)。商用APIに解析を拒否されてから
        何分で切替できるか
      - RB23 の権限境界で、1ワーカーの侵害はどこで止まる設計か (ノード昇格・認証情報窃取・クラスタ間横移動の各段)
      - 誰がクラスタ横断の認証情報一覧を確定し、どの権限で一括失効を承認するか (RB06/AC18)
      - RB24 の週末・夜間の即時ページングは機能するか。オンコールの二重化はあるか
    focus_items: [RB20, RB21, RB22, RB23, RB24, RB06, RB05, RB08, AC16, AC17, AC18]
