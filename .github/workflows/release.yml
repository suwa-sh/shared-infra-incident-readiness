# Verify, publish, attest, and post-verify an immutable multi-arch release image.
name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Validate tag, package, and README versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must be vMAJOR.MINOR.PATCH: $TAG" >&2
            exit 1
          }
          PROJECT_VERSION=$(python -c 'import pathlib,re; text=pathlib.Path("pyproject.toml").read_text(); print(re.search(r"^version\s*=\s*\"([^\"]+)\"", text, re.M).group(1))')
          test "$TAG" = "v$PROJECT_VERSION" || {
            echo "tag $TAG does not match pyproject version $PROJECT_VERSION" >&2
            exit 1
          }

      - name: Install and test release source
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
          pytest tests/ -v
          python scripts/check_docs.py
          python scripts/check_docs.py --cli
          python scripts/check_sources.py

  image:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish immutable version and update latest
        id: publish
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          IMAGE=$(printf '%s/%s' "$REGISTRY" "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          ENGINE_VERSION=$(sed -n 's/.*overlay-scoring-skeleton==\([0-9][0-9.]*\).*/\1/p' pyproject.toml)
          INSPECT_ERROR="$RUNNER_TEMP/image-inspect.err"
          if docker buildx imagetools inspect "$IMAGE:$TAG" >/dev/null 2>"$INSPECT_ERROR"; then
            echo "refusing to attest an existing image without verifying its source revision: $IMAGE:$TAG" >&2
            exit 1
          fi
          if ! {
            grep -Fxq "ERROR: $IMAGE:$TAG: not found" "$INSPECT_ERROR" ||
            grep -Fxq "ERROR: $IMAGE:$TAG: manifest unknown" "$INSPECT_ERROR" ||
            grep -Fxq "ERROR: $IMAGE:$TAG: name unknown" "$INSPECT_ERROR"
          }; then
            echo "could not confirm that the release image is absent; refusing to publish $IMAGE:$TAG" >&2
            cat "$INSPECT_ERROR" >&2
            exit 1
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "OVERLAY_ENGINE_VERSION=$ENGINE_VERSION" \
            --build-arg "APP_VERSION=${TAG#v}" \
            --provenance=mode=max \
            --sbom=true \
            --metadata-file "$RUNNER_TEMP/build-metadata.json" \
            -t "$IMAGE:$TAG" \
            --push .
          DIGEST=$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/build-metadata.json")
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$DIGEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Install release verification dependencies
        run: python -m pip install ".[test]"

      - name: Verify the released artifact boundary
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/check_docs.py --container --container-version "$TAG"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.publish.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          printf '## Container artifact\n\n%s@%s\n' "$IMAGE" "$DIGEST" > "$NOTES"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            CURRENT="$RUNNER_TEMP/current-release-notes.md"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$CURRENT"
            if ! grep -Fq "$DIGEST" "$CURRENT"; then
              printf '\n\n' >> "$CURRENT"
              cat "$NOTES" >> "$CURRENT"
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file "$CURRENT"
          else
            GENERATED="$RUNNER_TEMP/generated-release-notes.json"
            gh api \
              --method POST \
              "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" > "$GENERATED"
            jq -r .body "$GENERATED" > "$RUNNER_TEMP/generated-release-notes.md"
            printf '\n\n' >> "$RUNNER_TEMP/generated-release-notes.md"
            cat "$NOTES" >> "$RUNNER_TEMP/generated-release-notes.md"
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
              --notes-file "$RUNNER_TEMP/generated-release-notes.md"
          fi
